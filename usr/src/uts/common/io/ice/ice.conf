#
# Driver.conf file for the Intel E810 Ethernet driver (ice).
# See ice(4D) for valid options.  All tunables are commented out at their
# default; uncomment to override.
#

#
# num_queues: ceiling on the number of Rx/Tx queue pairs, 1 to 127 (the MAC
# ring limit per group).  The driver uses one queue pair per CPU up to this
# ceiling, limited also by the queues and MSI-X vectors firmware gives this
# function and the vectors the platform grants.  The count need not be a
# power of two.  A value outside 1 to 127 is clamped and logged.  Default 16.
#
# num_queues=16;

#
# tx_lso_enable: set to 0 to stop advertising TCP large-send (LSO/TSO)
# offload.  Default 1.  LSO is never advertised in DDP safe mode.
#
# tx_lso_enable=1;

#
# default_mtu: the initial MTU in bytes.  The MTU is also settable at runtime
# with dladm(8).
#
# default_mtu=1500;

#
# rx_limit_per_intr: maximum frames processed per rx ring per interrupt before
# the driver yields and schedules an ITR-paced software interrupt for the
# rest.  Clamped to [16, 4096].  Not expected to need tuning.
#
# rx_limit_per_intr=256;

#
# rdma_enable: set to 1 to run the RDMA function as the irdma child driver.
# RDMA also needs the firmware capability and the DDP package.  Default 0.
#
# rdma_enable=0;

#
# rdma_vectors: MSI-X vectors kept for the RDMA function when it is enabled,
# 1 to 16.  They are taken before the queue vectors, and a grant too small for
# them leaves RDMA off.  Default 2.
#
# rdma_vectors=2;
