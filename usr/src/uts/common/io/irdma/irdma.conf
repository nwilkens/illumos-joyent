#
# Driver.conf file for the Intel E800 series RDMA function (irdma).  The
# function exists only when rdma_enable is set in ice.conf.  All tunables are
# commented out at their default.
#

#
# qp_limit: the most queue pairs the RDMA function sizes its host memory
# for, 128 to 65536.  Firmware limits can lower it.  Default 1024.
#
# qp_limit=1024;

#
# cqp_timeout_ms: how long a control command may take before the driver
# gives up on the device and asks for a PF reset, 100 to 60000.
# Default 5000.
#
# cqp_timeout_ms=5000;

#
# comp_vectors: the most completion vectors, 1 to 32.  Each RDMA vector
# after the first that ice keeps (rdma_vectors in ice.conf) carries one
# completion event queue, so the count is also limited by that.
# Default 32.
#
# comp_vectors=32;

#
# numa_lgrp: the lgroup whose CPUs take the RDMA vectors' interrupts.  By
# default the driver takes the lgroup whose CPUs read a device register
# fastest, when one is clearly fastest, and otherwise leaves the vectors
# where they are.
#
# numa_lgrp=0;

#
# numa_place: what moves to the chosen CPUs.  1 moves the interrupts, 2
# binds the vector threads to their interrupt's CPU, 3 does both and 0
# neither.  Default 1; binding the threads lowered multi-QP throughput.
#
# numa_place=1;
